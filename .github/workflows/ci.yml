name: Go quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: sqlc-dev/setup-sqlc@bac53b7fb28c039a6c7f5736fd1e89744021bdd6 # v5.0.0
        with:
          sqlc-version: '1.31.1'
      - name: Verify dependencies and generated queries
        run: |
          go mod tidy -diff
          make generate
          test -z "$(git status --porcelain -- internal/db/store)"
      - name: Check formatting, vet, race tests and coverage
        run: make check
      - name: Generate HTML coverage report
        run: go tool cover -html=coverage.out -o coverage.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage
          path: coverage.html
      - name: Check reachable vulnerabilities
        run: go tool govulncheck ./...
