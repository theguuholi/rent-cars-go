name: rent-cars-go
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: rent_cars_go_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "rent_cars_go_dev"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
